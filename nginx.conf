worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # Docker's embedded DNS lets the proxy recover when the backend container
    # is recreated and receives a new IP address.
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # ── SSE: matched exactly, BEFORE the /api/ prefix block ──────────────
        # Disable all proxy buffering so event-stream frames flush immediately.
        location = /api/dashboard/stream {
            set $backend_host backend;
            proxy_pass http://$backend_host:8000/dashboard/stream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # ── REST API: strip /api prefix before forwarding ────────────────────
        location /api/ {
            set $backend_host backend;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$backend_host:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── WebSocket ─────────────────────────────────────────────────────────
        location /ws/ {
            set $backend_host backend;
            rewrite ^/ws/(.*)$ /ws/$1 break;
            proxy_pass http://$backend_host:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # ── React SPA: serve index.html for all unmatched routes ─────────────
        location / {
            try_files $uri $uri/ /index.html;
            # Always fetch the HTML shell afresh so a redeploy immediately
            # points browsers at the current hashed frontend bundle.
            add_header Cache-Control "no-store, max-age=0";
        }
    }
}

version: "3.8"

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  mongodb:
    image: mongo:7
    container_name: sdg_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sdg_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: sdg_redis
    ports:
      - "6379:6379"
    networks:
      - sdg_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: sdg_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - sdg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Application ─────────────────────────────────────────────────────────────

  backend:
    build: .
    container_name: sdg_backend
    # No --reload in production; workers=2 for async FastAPI is sufficient
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - PYTHONPATH=/app
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - sdg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery_worker:
    build: .
    container_name: sdg_celery_worker
    command: celery -A core.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - PYTHONPATH=/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sdg_network

  celery_beat:
    build: .
    container_name: sdg_celery_beat
    command: celery -A core.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sdg_network

  # ── Frontend + reverse proxy ─────────────────────────────────────────────────
  # Built from frontend/Dockerfile (node build → nginx:alpine with dist)
  # nginx.conf is mounted to handle SPA routing, /api proxy, /ws proxy, and SSE.

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sdg_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sdg_network

volumes:
  mongo_data:
  minio_data:

networks:
  sdg_network:
    driver: bridge

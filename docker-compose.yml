version: "3.8"

services:
  api:
    build: .
    container_name: sdg_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
      - minio
    volumes:
      - .:/app
    networks:
      - sdg_network

  mongodb:
    image: mongo:7
    container_name: sdg_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sdg_network

  redis:
    image: redis:7-alpine
    container_name: sdg_redis
    ports:
      - "6379:6379"
    networks:
      - sdg_network

  celery_worker:
    build: .
    container_name: sdg_celery_worker
    command: celery -A core.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - mongodb
    volumes:
      - .:/app
    networks:
      - sdg_network

  celery_beat:
    build: .
    container_name: sdg_celery_beat
    command: celery -A core.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - .:/app
    networks:
      - sdg_network

  minio:
    image: minio/minio
    container_name: sdg_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - sdg_network

  nginx:
    image: nginx:alpine
    container_name: sdg_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - sdg_network

volumes:
  mongo_data:
  minio_data:

networks:
  sdg_network:
    driver: bridge
